name: Últimos posts del blog

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://cafeandcode.com/feed/"
          max_post_count: 5
          commit_message: "Actualiza los últimos posts del blog"
